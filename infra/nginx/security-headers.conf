# Shared security headers.
#
# nginx does NOT inherit `add_header` from an outer context: any location that
# declares its own `add_header` drops every `add_header` from the `server`
# block. This fragment is therefore included both in the `server` block and in
# every location that sets its own `add_header` (so Cache-Control and the
# security headers coexist).
#
# It is installed at /etc/nginx/security-headers.conf -- deliberately NOT under
# conf.d/, because /etc/nginx/conf.d/*.conf is automatically included into the
# http block at startup.
#
# Include it with the ABSOLUTE path: a relative include resolves against the
# nginx prefix (/etc/nginx), not against the directory of the including file.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
