# Production web server for Idea Flow.
#
# Contract with the web image: the `prod` stage of apps/web/Dockerfile must
# COPY this file to /etc/nginx/conf.d/default.conf and the build output to
# /usr/share/nginx/html, and the server MUST listen on 8080 (compose exposes
# 8080 and its healthcheck probes /healthz).
#
# Why 8080 and not 80: the container then runs as an unprivileged user with no
# need for CAP_NET_BIND_SERVICE.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. `resolver` + variables in proxy_pass force a fresh
    # lookup instead of a startup-time cached IP, so recreating the api
    # container never leaves nginx pointing at a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    charset utf-8;

    # never cache the entrypoint
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # used by the compose healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api  ->  /  so the api serves unprefixed routes (/health, /users, ...)
    location = /api {
        return 308 /api/;
    }

    location ~ ^/api/(.*)$ {
        set $api_upstream "api:3000";
        set $api_path "/$1";

        proxy_pass http://$api_upstream$api_path;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # do not let a failing API turn into a cached error page
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # fingerprinted assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # the entrypoint must never be cached, or a deploy is invisible to browsers
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # dotfiles and source maps are never served
    location ~ /\. {
        deny all;
        access_log off;
    }
    location ~ \.(map|ts|tsx|env)$ {
        deny all;
        access_log off;
    }
}
