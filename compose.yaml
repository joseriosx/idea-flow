# Idea Flow — compose file (local development)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f web api
#   reset the stack + its database: ./infra/scripts/dev-reset.sh
#
# The project name is fixed at the top so every command targets the same stack.
name: idea-flow

# --------------------------------------------------------------------------
# Anchors
# --------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  init: true
  networks:
    - idea-flow

# --------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-idea_flow}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    networks:
      - idea-flow

  api:
    <<: *app-base
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    image: idea-flow-api:dev
    restart: "no"
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-idea_flow}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      TZ: ${TZ:-UTC}
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-true}
      WATCHPACK_POLLING: ${WATCH_POLLING:-true}
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  web:
    <<: *app-base
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: idea-flow-web:dev
    restart: "no"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      TZ: ${TZ:-UTC}
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-true}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    logging: *logging

# --------------------------------------------------------------------------
# Named volumes / networks
# --------------------------------------------------------------------------
volumes:
  postgres_data_dev:
    driver: local
  api_node_modules:
    driver: local
  web_node_modules:
    driver: local

networks:
  idea-flow:
    driver: bridge
