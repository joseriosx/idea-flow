# Idea Flow — development overlay
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#   docker compose -f compose.yaml -f compose.dev.yaml logs -f api web
#   docker compose -f compose.yaml -f compose.dev.yaml down
#
# Strategy: the host source tree is bind mounted into the container and the
# toolchain runs inside the image (no image rebuild per code change).
# `node_modules` is a NAMED VOLUME so the host-installed Linux/macOS packages
# never shadow the container's Linux ones.
#
# Project name differs from prod => separate network and separate database
# volume. Dev data is disposable.

name: idea-flow-dev

x-app: &app
  init: true
  networks:
    - idea-flow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # loopback only: never expose the dev database to the LAN
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    <<: *app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    image: idea-flow-api:dev
    # `restart: "no"` on purpose: a crashed API must stay crashed and visible
    # in the logs instead of silently restarting forever.
    restart: "no"
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      # containers must bind 0.0.0.0, never 127.0.0.1
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-idea_flow}}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      TZ: ${TZ:-UTC}
      # bind mounts on Docker Desktop do not always deliver inotify events
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-true}
      WATCHPACK_POLLING: ${WATCH_POLLING:-true}
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  web:
    <<: *app
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: idea-flow-web:dev
    restart: "no"
    # Vite must listen on 0.0.0.0 to be reachable from outside the container
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      TZ: ${TZ:-UTC}
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-true}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    # Vite does not need the API to boot, and blocking it here would make a
    # slow API look like a broken web server.
    depends_on:
      - api
    logging: *logging

volumes:
  api_node_modules:
    driver: local
  web_node_modules:
    driver: local
